<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Typical rebuttal versus truth-first counterargument</title>
  <desc id="desc">A visual comparison of one-shot opposition and evidence-first analysis.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111a31"/></linearGradient></defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <text x="800" y="88" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="800">Normal counterargument → Truth-first counterargument</text>
  <text x="800" y="130" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">The improvement is not more aggression. It is better epistemic plumbing.</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="90" y="185" width="650" height="490" rx="28" fill="#251720" stroke="#fb7185" stroke-width="3"/>
    <text x="140" y="245" fill="#fda4af" font-size="31" font-weight="800">TYPICAL ONE-SHOT REBUTTAL</text>
    <g fill="#e2e8f0" font-size="24">
      <circle cx="150" cy="315" r="8" fill="#fb7185"/><text x="180" y="323">Assume the requested side is correct</text>
      <circle cx="150" cy="380" r="8" fill="#fb7185"/><text x="180" y="388">Collect many links without tracing origin</text>
      <circle cx="150" cy="445" r="8" fill="#fb7185"/><text x="180" y="453">Mix facts, causes, and values</text>
      <circle cx="150" cy="510" r="8" fill="#fb7185"/><text x="180" y="518">Write a clever “gotcha” line</text>
      <circle cx="150" cy="575" r="8" fill="#fb7185"/><text x="180" y="583">Leave uncertainty and comeback untested</text>
    </g>
    <rect x="215" y="620" width="400" height="42" rx="21" fill="#35141f"/>
    <text x="415" y="648" text-anchor="middle" fill="#fecdd3" font-size="18" font-weight="700">FAST · CONFIDENT · EASY TO REFUTE</text>
    <path d="M770 430 H830" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M815 410 L840 430 L815 450" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="860" y="185" width="650" height="490" rx="28" fill="#0e2927" stroke="#2dd4bf" stroke-width="3"/>
    <text x="910" y="245" fill="#99f6e4" font-size="31" font-weight="800">TRUTH-FIRST SKILL</text>
    <g fill="#e2e8f0" font-size="24">
      <circle cx="920" cy="315" r="8" fill="#2dd4bf"/><text x="950" y="323">Freeze and atomize the exact claim</text>
      <circle cx="920" cy="380" r="8" fill="#2dd4bf"/><text x="950" y="388">Trace sources and deduplicate echoes</text>
      <circle cx="920" cy="445" r="8" fill="#2dd4bf"/><text x="950" y="453">Test evidence against both sides</text>
      <circle cx="920" cy="510" r="8" fill="#2dd4bf"/><text x="950" y="518">Concede, narrow, clarify, or rebut</text>
      <circle cx="920" cy="575" r="8" fill="#2dd4bf"/><text x="950" y="583">Stress-test comeback + do-not-claim</text>
    </g>
    <rect x="985" y="620" width="400" height="42" rx="21" fill="#0a3732"/>
    <text x="1185" y="648" text-anchor="middle" fill="#ccfbf1" font-size="18" font-weight="700">CALIBRATED · HONEST · RESILIENT</text>
  </g>
</svg>
