<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Truth-First Counterargument workflow</title>
  <desc id="desc">Six stages from capturing a claim to a stress-tested response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text x="90" y="92" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="50" font-weight="800">From viral claim to defensible reply</text>
  <text x="92" y="136" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23">A truth gate sits between research and rebuttal. The system may tell you not to argue.</text>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M485 300 H565"/><path d="M1035 300 H1115"/><path d="M1340 425 V505"/><path d="M1115 650 H1035"/><path d="M565 650 H485"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(90,205)">
      <rect width="395" height="190" rx="24" fill="#0d2330" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#2dd4bf"/><text x="48" y="56" fill="#06201c" font-size="24" font-weight="800" text-anchor="middle">1</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Capture</text>
      <text x="30" y="104" fill="#cbd5e1" font-size="21">Exact quote · original link · date</text>
      <text x="30" y="137" fill="#cbd5e1" font-size="21">speaker · scope · definitions</text>
      <text x="30" y="169" fill="#7dd3fc" font-size="18">No rebuttal to a vague paraphrase</text>
    </g>
    <g transform="translate(565,205)">
      <rect width="470" height="190" rx="24" fill="#101d33" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#60a5fa"/><text x="48" y="56" fill="#071625" font-size="24" font-weight="800" text-anchor="middle">2</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Atomize</text>
      <text x="30" y="104" fill="#cbd5e1" font-size="21">Fact · cause · statistic · definition</text>
      <text x="30" y="137" fill="#cbd5e1" font-size="21">history · prediction · value judgment</text>
      <text x="30" y="169" fill="#93c5fd" font-size="18">Score claims separately</text>
    </g>
    <g transform="translate(1115,205)">
      <rect width="395" height="190" rx="24" fill="#1b1a33" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#a78bfa"/><text x="48" y="56" fill="#170f2a" font-size="24" font-weight="800" text-anchor="middle">3</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Trace evidence</text>
      <text x="30" y="104" fill="#cbd5e1" font-size="21">Open primary sources</text>
      <text x="30" y="137" fill="#cbd5e1" font-size="21">Deduplicate shared origins</text>
      <text x="30" y="169" fill="#c4b5fd" font-size="18">Ten echoes can still be one source</text>
    </g>
    <g transform="translate(1115,505)">
      <rect width="395" height="190" rx="24" fill="#2b2313" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#fbbf24"/><text x="48" y="56" fill="#2a1c02" font-size="24" font-weight="800" text-anchor="middle">4</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Calibrate</text>
      <text x="30" y="104" fill="#cbd5e1" font-size="21">Truth estimate + research confidence</text>
      <text x="30" y="137" fill="#cbd5e1" font-size="21">Expose contradictions and gaps</text>
      <text x="30" y="169" fill="#fde68a" font-size="18">No fake precision</text>
    </g>
    <g transform="translate(565,505)">
      <rect width="470" height="190" rx="24" fill="#17271e" stroke="#4ade80" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#4ade80"/><text x="48" y="56" fill="#082013" font-size="24" font-weight="800" text-anchor="middle">5</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Honesty gate</text>
      <text x="30" y="104" fill="#86efac" font-size="21" font-weight="700">CONCEDE</text><text x="151" y="104" fill="#cbd5e1" font-size="21">when the core is true</text>
      <text x="30" y="137" fill="#fde68a" font-size="21" font-weight="700">NARROW</text><text x="140" y="137" fill="#cbd5e1" font-size="21">when only scope fails</text>
      <text x="30" y="170" fill="#fda4af" font-size="21" font-weight="700">REBUT</text><text x="128" y="170" fill="#cbd5e1" font-size="21">when a premise breaks</text>
    </g>
    <g transform="translate(90,505)">
      <rect width="395" height="190" rx="24" fill="#2b1824" stroke="#fb7185" stroke-width="2"/>
      <circle cx="48" cy="48" r="25" fill="#fb7185"/><text x="48" y="56" fill="#2a0914" font-size="24" font-weight="800" text-anchor="middle">6</text>
      <text x="90" y="55" fill="#f8fafc" font-size="29" font-weight="800">Reply + stress test</text>
      <text x="30" y="104" fill="#cbd5e1" font-size="21">Everyday reply · evidence · logic</text>
      <text x="30" y="137" fill="#cbd5e1" font-size="21">strongest comeback · answer</text>
      <text x="30" y="169" fill="#fda4af" font-size="18">Plus one thing you must not claim</text>
    </g>
  </g>
  <rect x="90" y="770" width="1420" height="75" rx="20" fill="#0b1528" stroke="#26344c"/>
  <text x="800" y="817" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">OUTPUT · verdict % + confidence · ready reply · claim-level sources · likely comeback · do-not-claim boundary</text>
</svg>
