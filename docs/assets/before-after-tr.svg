<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Normal karşı argüman ile kanıt öncelikli karşı argüman</title>
  <desc id="desc">Tek seferlik itiraz ile kanıt öncelikli analizin görsel karşılaştırması.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111a31"/></linearGradient></defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <text x="800" y="88" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="800">Normal karşı argüman → Doğruluk öncelikli sistem</text>
  <text x="800" y="130" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">Gelişme daha saldırgan olmak değil; kanıt akışını sağlam kurmaktır.</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="90" y="185" width="650" height="490" rx="28" fill="#251720" stroke="#fb7185" stroke-width="3"/>
    <text x="140" y="245" fill="#fda4af" font-size="31" font-weight="800">TİPİK TEK SEFERLİK İTİRAZ</text>
    <g fill="#e2e8f0" font-size="24">
      <circle cx="150" cy="315" r="8" fill="#fb7185"/><text x="180" y="323">İstenen tarafı baştan doğru varsay</text>
      <circle cx="150" cy="380" r="8" fill="#fb7185"/><text x="180" y="388">Köken izlemeden çok link topla</text>
      <circle cx="150" cy="445" r="8" fill="#fb7185"/><text x="180" y="453">Olgu, neden ve değeri birbirine karıştır</text>
      <circle cx="150" cy="510" r="8" fill="#fb7185"/><text x="180" y="518">Parlak bir “kapak” cümlesi yaz</text>
      <circle cx="150" cy="575" r="8" fill="#fb7185"/><text x="180" y="583">Belirsizliği ve dönüşü test etme</text>
    </g>
    <rect x="215" y="620" width="400" height="42" rx="21" fill="#35141f"/>
    <text x="415" y="648" text-anchor="middle" fill="#fecdd3" font-size="18" font-weight="700">HIZLI · KENDİNDEN EMİN · KOLAY ÇÜRÜR</text>
    <path d="M770 430 H830" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M815 410 L840 430 L815 450" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="860" y="185" width="650" height="490" rx="28" fill="#0e2927" stroke="#2dd4bf" stroke-width="3"/>
    <text x="910" y="245" fill="#99f6e4" font-size="31" font-weight="800">TRUTH-FIRST SKİLİ</text>
    <g fill="#e2e8f0" font-size="24">
      <circle cx="920" cy="315" r="8" fill="#2dd4bf"/><text x="950" y="323">Tam iddiayı kilitle ve alt parçalara ayır</text>
      <circle cx="920" cy="380" r="8" fill="#2dd4bf"/><text x="950" y="388">Kaynağı izle, yankıları tekilleştir</text>
      <circle cx="920" cy="445" r="8" fill="#2dd4bf"/><text x="950" y="453">Her iki tarafı da yanlışlamaya çalış</text>
      <circle cx="920" cy="510" r="8" fill="#2dd4bf"/><text x="950" y="518">Kabul et, daralt, netleştir veya çürüt</text>
      <circle cx="920" cy="575" r="8" fill="#2dd4bf"/><text x="950" y="583">Dönüşü + “söyleme” sınırını test et</text>
    </g>
    <rect x="985" y="620" width="400" height="42" rx="21" fill="#0a3732"/>
    <text x="1185" y="648" text-anchor="middle" fill="#ccfbf1" font-size="18" font-weight="700">KALİBRE · DÜRÜST · DAYANIKLI</text>
  </g>
</svg>
